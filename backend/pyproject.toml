[project]
name = "neuroforge-api"
version = "0.0.0"
description = "NeuroForge backend — real neuron data + biophysical simulation."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "requests>=2.32",
  "numpy>=1.26,<2.0",
  "scipy>=1.13",
  "brian2>=2.7",
  "sqlalchemy>=2.0",
  # NOTE: allensdk 2.16 pins numpy<1.24, which has no py3.12 wheels.
  # Phase 1 decision required: (a) drop py3.12 → py3.11, (b) replace allensdk
  # with direct REST calls to api.brain-map.org, or (c) isolate allensdk in a
  # separate py3.11 venv. Tracked in docs/audits/phase-0.md.
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["neuroforge_api*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["neuroforge_api/tests"]
asyncio_mode = "auto"
